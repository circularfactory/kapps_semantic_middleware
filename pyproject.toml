[project]
name = "kapps-semantic-middleware"
version = "0.1.1"
description = "Semantic middleware for industrial data integration, built on transitional-sync-middleware"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# Both names reach PyPI and nothing else does. The publish repo takes one commit per release
# and carries no ancestry, so this list, `LICENSE`, `README.md` and
# `CHANGELOG.md` are the entire credit for the work -- there is no contributor graph on the
# other side to fall back on. `credited` in `release/config.toml` asserts both survive into
# the built wheel's METADATA, because a build backend that drops an author is a thing that has
# actually happened in this family (poetry-core wrote only the first entry).
authors = [
    { name = "Etienne Hoffmann", email = "etienne.hoffmann@kit.edu" },
    { name = "Sören Weindel", email = "soeren.weindel@kit.edu" },
]
maintainers = [
    { name = "Etienne Hoffmann", email = "etienne.hoffmann@kit.edu" },
    { name = "Sören Weindel", email = "soeren.weindel@kit.edu" },
]
# All three siblings are published, so all three are ordinary version pins. They were
# editable path sources until this release: `[tool.uv.sources]` pointed each
# at `../<name>`, which uv locks as a *path* with no revision, so `uv.lock` recorded where each
# sibling was and nothing about what was in it. That is why a fresh machine did not reproduce a
# working demo, and it is why `siblings.lock.toml` had to exist beside the lockfile.
#
# All three are ranges of the form `~=X.Y.Z`, which admits `>=X.Y.Z, ==X.Y.*`: a patch release of
# a sibling reaches a fresh install with no human in the loop, and this project's own lock takes
# it on a deliberate `uv lock --upgrade-package <name>`, while a minor release needs a deliberate
# bump of the pin here, proven by this project's own test suite before it lands.
dependencies = [
    "kapps-ogm~=0.2.0",
    "kapps-triplestore-interface~=2.1.1",
    # The range's floor is 0.1.0 and not 0.2.6: this is the fork of `aas-middleware`, published
    # under its own name with its own numbering, which restarted. The import package renames with
    # it, to `transitional_sync_middleware`, and that rename happens at *its* release time -- so a
    # dev checkout of the sibling still says `aas_middleware` while the published wheel does
    # not. Swapping this pin and sweeping this project's imports had to be one change.
    "transitional-sync-middleware~=0.1.0",
    "httpx>=0.27.0",
    # transitional_sync_middleware keeps aiomqtt in an optional "industrial" extra, but the MQTT
    # semantic connector is a first-class part of this middleware, so it is a plain
    # dependency here. Declaring it is also what stops a failure the OGM repo once had --
    # importing a module the manifest never mentions -- from recurring.
    "aiomqtt>=2.1.0",
    # fastapi is imported directly by the library itself -- middleware.py, rest_router.py and
    # activity.py all `from fastapi import ...`, not just the demo. It only survived until now by
    # arriving transitively through the sibling, which is not a promise that repo makes, so it
    # is declared here. The transitive route stays as a backup.
    "fastapi>=0.111.0",
]

[project.scripts]
# Installed unconditionally, because a console script cannot be gated on an extra. Without
# `[examples]` the factory exits on a missing uvicorn/amqtt, which is the honest failure: the
# demo is present and its runtime dependencies are not.
kapps-transferunit-factory = "kapps_semantic_middleware.demonstrations.transferunits.__main__:main"
# Copies the runnable scenario files out of the installed package into a directory the user
# chooses, because a notebook inside site-packages cannot be opened, edited or re-run.
kapps-examples = "kapps_semantic_middleware.examples_cli:main"

[project.optional-dependencies]
# `[examples]` is the one umbrella a learner installs to RUN everything: scenario 1, scenario 2
# (as .py or .ipynb) and the six-process factory demo. A plain `uv add kapps-semantic-middleware`
# installs the reference implementation alone; `uv add "kapps-semantic-middleware[examples]"` adds
# what the runnable examples need on top of it. fastapi is NOT here: the library imports it
# directly, so it moved to the core dependencies above.
examples = [
    "uvicorn>=0.29.0",
    # The per-unit broker. Pure Python and run in-process, because mosquitto
    # would need root, which a fresh checkout cannot assume. The factory needs it; the
    # scenarios do not; the single umbrella covers both.
    "amqtt>=0.11.0",
    # scenario 2 imports rdflib.namespace directly. Declared here rather than leaned on
    # transitively through kapps-ogm / kapps-triplestore-interface.
    "rdflib>=7.1.3",
]
# The notebook toolchain is a separate, heavier opt-in -- only someone who opens the .ipynb
# needs it (jupyter alone pulls ~100 packages). The scenarios run as plain .py with `[examples]`
# alone; `uv add "kapps-semantic-middleware[examples,notebooks]"` adds the interactive path.
notebooks = [
    "jupyter>=1.1.1",
    "jupytext>=1.16.0",
    "nbconvert>=7.16.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15.15",
    "rdflib>=7.1.3",
    "jupyter>=1.1.1",
    "nbconvert>=7.16.0",
    "jupytext>=1.16.0",
    "httpx>=0.27.0",
    # A pure-Python MQTT broker, run in-process as a pytest fixture. mosquitto would need
    # root to install, which no CI runner and no fresh checkout can assume; this keeps the
    # mock PLC's round-trip genuinely live and portable. Also declared under the
    # `examples` extra, because the demo runs one per unit at runtime.
    "amqtt>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-m", "not lap and not smoke"]
markers = [
    "live: needs a reachable GraphDB (the GRAPHDB_* env vars). Applied automatically to any test that requests the `graphdb` fixture, so `-m 'not live'` selects the tier that runs anywhere.",
    "lap: measures a control lap rather than asserting anything, and its timings are machine-dependent. Deselected by default (see `addopts`); run it with `-m lap -s` when the algorithm's tick needs revisiting.",
    "smoke: boots the whole factory as six real processes and re-checks the claims only a run can show. Deselected by default (see `addopts`) because it needs the launcher's fixed port free, seeds the graph the GRAPHDB_* variables point at, and costs about a minute; run it with `-m smoke`.",
]
# pytest-asyncio warns when this is unset and defaults it to "function". Stated explicitly so
# the default is a decision rather than a warning; the async fixtures here are per-test.
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
# The library and the demo. `demo` typechecks only because demo/ and demo/transferunits/
# carry an __init__.py -- without them mypy stops at the first relative import and checks
# nothing at all. The factory design already called demo/transferunits a real package; now it is one.
files = ["src", "demo"]

[[tool.mypy.overrides]]
# None of the three siblings ships a py.typed marker, and neither does amqtt. Left
# unsilenced these produce 44 import-untyped errors that bury the real ones -- the whole
# reason the milestone-1 review found only one genuine type error under the noise.
# This suppresses the missing marker, not our own annotations.
module = [
    "transitional_sync_middleware.*",
    "kapps_ogm.*",
    "kapps_triplestore_interface.*",
    "amqtt.*",
]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The demo ships inside the library's namespace as
# `kapps_semantic_middleware.demonstrations`, rather than claiming a top-level `demo` on
# PyPI -- a name that generic would collide with half the index. The scenario rule fixes where
# scenario code lives *on disk* (`demo/`), and says nothing about its installed name, so the
# remap below satisfies both.
#
# Nothing here decides whether a consumer gets the demo's dependencies: that is the
# `demonstrations` extra. Wheels cannot select files by extra, so the demo's ~200 KB always
# ships, and importing it without the extra fails on fastapi with a clear ImportError.
packages = ["src/kapps_semantic_middleware", "demo", "examples"]

# An editable install cannot follow the rewrite below -- hatchling refuses a dev-mode build
# when a source rewrite *changes* a prefix instead of removing one. So dev mode puts `src`
# and the repository root on the path unchanged, and a developer imports `demo.transferunits`
# exactly as before. `launcher._PACKAGE` derives the spawn paths from `__package__`, so the
# same code drives children under either name.
dev-mode-dirs = ["src", "."]

[tool.hatch.build.targets.wheel.sources]
"src/kapps_semantic_middleware" = "kapps_semantic_middleware"
"demo" = "kapps_semantic_middleware/demonstrations"
"examples" = "kapps_semantic_middleware/examples"

[tool.hatch.build.targets.wheel.force-include]
# The agent-facing documentation lives at the repo root, so without this it reaches someone
# browsing GitHub and nobody else. A consuming subproject's agent reads its dependency in
# site-packages, where it would otherwise find `CONTEXT.md` -- which cites decision records by
# number throughout -- and none of the pages written to replace them. That is backwards: the
# citations arrive and their replacements do not.
#
# Costs nothing on balance. These three are 84 KB; the 32 ADRs that stop shipping alongside this
# are 268 KB, so the wheel gets ~184 KB smaller while gaining the useful half.
#
# Deliberately NOT a release-time edit. The release-time edits (`release/edits.toml`) all remove
# facts that are only true in a dev checkout (sibling path sources, the ADR genre); this one is equally
# true in both trees. Release-only would also mean the wheel the release cross-check builds and
# tests is not the wheel that ships.
"AGENTS.md" = "kapps_semantic_middleware/AGENTS.md"
"CONTEXT-MAP.md" = "kapps_semantic_middleware/CONTEXT-MAP.md"
"docs/mechanics" = "kapps_semantic_middleware/docs/mechanics"

# There is deliberately no entry here for the compose files. They live at `examples/docker/`
# in the source tree, so the `examples` -> `kapps_semantic_middleware/examples`
# mapping above already carries them into the wheel, and `kapps-examples` copies them out with
# the rest of the payload.
#
# They used to sit at the repository root. That put them in the release allowlist -- so they
# reached anyone browsing the source -- and in neither the wheel nor `PAYLOAD_FILES`, so the
# one instruction the documentation gives a pip-installing user, `cd docker && docker compose
# up -d`, named a directory they had no way to obtain. A force-include would have fixed the
# wheel and left a second divergence behind it: `kapps-examples` reads its payload out of
# `examples/`, and in a *dev checkout* there is no wheel remapping, so the copy would have
# worked when installed and failed from a source tree. One location is what makes those agree.

# There is deliberately no `[tool.uv.sources]` here, and this is the release that removed it.
# Three editable path entries pointed at `../aas_middleware_inf`,
# `../kapps_ogm` and `../kapps_triplestore_interface`; all three siblings are now published, so
# the floors above are real pins and `uv.lock` resolves from the index alone.
#
# Two things retired with the block, and both were only ever needed because of it:
# `siblings.lock.toml`, which recorded the commit each sibling had to be on because a path
# source records no revision, and `scripts/check_siblings.py`, which checked a machine against
# it. A `uv sync` on a clean checkout now reproduces what CI resolves.
#
# The `[tool.uv] override-dependencies` hack went earlier, when the triplestore interface was
# published under its new name. It existed because
# kapps_ogm's manifest pinned the triplestore interface to a git URL, which uv saw as
# conflicting with this project's editable path source for the same package.
#
# **A path source must not come back for convenience.** The one legitimate need -- patching a
# sibling while developing against it -- is served by adding an entry locally and not
# committing it. Committed, it silently un-pins the release: the manifest would keep saying
# `>=0.1.0` while the lockfile resolved to whatever was on someone's disk.
