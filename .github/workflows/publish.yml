# Publish to PyPI when the release mechanism pushes a version tag.
#
# id-token: write is what makes trusted publishing work, and is why no API token
# is stored anywhere. The tag push from the release mechanism is what fires this.
#
# PyPI supports trusted publishing from GitHub and from gitlab.com only, not from
# a self-hosted GitLab. That is the whole reason this project is published from a
# repository here while development happens elsewhere.
#
# The upload depends on the hygiene job, so a failing check stops it: the same
# job hygiene.yml runs on every push, called here as a reusable workflow. The
# tag is protected, so nothing can be re-pushed under the same version; the
# hygiene job is what stands between a tag and an upload.

name: publish

on:
  push:
    tags: ['v*']

jobs:
  hygiene:
    uses: ./.github/workflows/hygiene.yml

  publish:
    needs: hygiene
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the distributions
        run: pipx run build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
